name: Publicar estado

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/build_pages_status.py'
      - 'docs/capture/**'
      - 'docs/progress/**'
      - 'analysis/**/*.md'
  schedule:
    - cron: '17 6 * * *'  # diario; ~1 min/ejecución, muy por debajo de la cuota gratuita
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generar índice público
        run: python3 scripts/build_pages_status.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
