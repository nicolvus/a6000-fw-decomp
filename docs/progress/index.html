<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sony A6000 FW RE — Avance total</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #c9d1d9;
      --muted: #8b949e;
      --done: #2ea043;
      --todo: #30363d;
      --border: #21262d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .stats {
      font-size: 1rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(31, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 16px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 2px;
      background: var(--todo);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cell.done {
      background: var(--done);
      border-color: rgba(46, 160, 67, 0.4);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: inline-block;
    }

    .done { background: var(--done); }
    .todo { background: var(--todo); }

    .source {
      margin-top: 14px;
      font-size: 0.85rem;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Avance total del proyecto</h1>
    <p>Visualización del censo de cobertura en formato de cuadrados.</p>
    <div class="stats"><strong>15.05%</strong> completado (<strong>56 / 372</strong> etiquetas decodificadas)</div>
    <div id="progress-grid" class="grid" aria-label="Cuadrícula de avance"></div>
    <div class="legend">
      <span>Menos</span>
      <span class="legend-box todo" aria-hidden="true"></span>
      <span class="legend-box done" aria-hidden="true"></span>
      <span>Más</span>
    </div>
    <p class="source">Fuente: <a href="https://github.com/nicolvus/a6000-fw-decomp/blob/main/analysis/s178_census/census.md">analysis/s178_census/census.md</a></p>
  </main>

  <script>
    const total = 372;
    const done = 56;
    const grid = document.getElementById('progress-grid');

    for (let i = 0; i < total; i += 1) {
      const cell = document.createElement('span');
      cell.className = `cell ${i < done ? 'done' : ''}`.trim();
      cell.title = i < done ? `Completado #${i + 1}` : `Pendiente #${i + 1}`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
