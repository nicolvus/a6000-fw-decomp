adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [string range [string trim [chip.dap apreg 0 0x0c]] 6 end] }
proc wr {a v} { chip.dap apreg 0 0x04 $a; chip.dap apreg 0 0x0c $v }
proc dump {tag} { set l ""; for {set i 0} {$i < 20} {incr i} { append l [rd [expr {0xf2406000+4*$i}]] " " }; echo "$tag: $l" }
dump "inicial "
wr 0xf2912314 0x00100000
after 20
dump "LED on  "
wr 0xf2406004 0x1
after 1
dump "start1ms"
after 20
dump "start20 "
wr 0xf2406004 0x10
after 20
dump "bit4    "
wr 0xf2406004 0x11
after 20
dump "bit0+4  "
wr 0xf2406004 0x0
wr 0xf2912318 0x00100000
dump "final   "
echo "d3=[rd 0xf2912310]"
shutdown
