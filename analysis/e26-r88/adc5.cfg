adapter driver cmsis-dap
transport select swd
adapter speed 4000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [expr {[string trim [chip.dap apreg 0 0x0c]]}] }
set t0 [clock milliseconds]; set n 0; set last 0
while {[expr {[clock milliseconds]-$t0}] < 40000} {
  set a [rd 0xf240602c]; set b [rd 0xf2406030]; incr n
  if {$a > 8 || $b > 8} { echo [format "T%d %d %d" [expr {[clock milliseconds]-$t0}] $a $b] }
}
echo "N $n"
shutdown
