adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [expr {[string trim [chip.dap apreg 0 0x0c]]}] }
proc wr {a v} { chip.dap apreg 0 0x04 $a; chip.dap apreg 0 0x0c $v }
echo "PRE d3=[format %08x [rd 0xf2912310]]"
wr 0xf2912314 0x00100000
echo "POST d3=[format %08x [rd 0xf2912310]]"
catch {
  set t0 [clock milliseconds]
  while {[expr {[clock milliseconds]-$t0}] < 45000} {
    set a [rd 0xf240602c]; set b [rd 0xf2406030]
    echo "T[expr {[clock milliseconds]-$t0}] $a $b"
    after 100
  }
}
wr 0xf2912318 0x00100000
echo "END d3=[format %08x [rd 0xf2912310]]"
shutdown
