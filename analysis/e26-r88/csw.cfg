adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
foreach c {0x43800042 0x03800042 0x23800042 0x63800042 0x13800042 0x53800042 0x0b800042 0x4b800042} {
  if {[catch {chip.dap apreg 0 0x00 $c}]} { echo "$c err"; continue }
  set l ""
  foreach a {0xf2406000 0xf240602c 0xf2406030 0xf2406034 0xf2406040} { chip.dap apreg 0 0x04 $a; append l [string trim [chip.dap apreg 0 0x0c]] " " }
  echo "CSW $c (lee [string trim [chip.dap apreg 0 0x00]]): $l"
}
chip.dap apreg 0 0x00 0x43800042
shutdown
