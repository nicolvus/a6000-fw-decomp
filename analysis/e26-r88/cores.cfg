adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
foreach {n b} {0 0x80110000 1 0x80112000 2 0x80114000 3 0x80116000} {
  target create c$n cortex_a -dap chip.dap -ap-num 1 -dbgbase $b -defer-examine
}
init
foreach n {0 1 2 3} {
  if {[catch {c$n arp_examine} e]} { echo "c$n: no ($e)"; continue }
  targets c$n
  catch {halt}; catch {wait_halt 1000}
  set pc [lindex [c$n get_reg pc] 1]
  catch {set m1 [c$n read_memory 0x43e85178 32 1]} m1
  catch {set m2 [c$n read_memory 0x43e8516c 32 1]} m2
  echo "c$n: [c$n curstate] pc=$pc m178=$m1 m16c=$m2"
  catch {resume}
}
shutdown
