adapter driver cmsis-dap
transport select swd
adapter speed 4000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [expr {[string trim [chip.dap apreg 0 0x0c]]}] }
set t0 [clock milliseconds]; set prev ""
while {[expr {[clock milliseconds]-$t0}] < 100000} {
  set s [list [rd 0xf240602c] [rd 0xf2406030]]
  for {set n 0} {$n < 8} {incr n} { lappend s [format %08x [rd [expr {0xf2910010 + 0x100*$n}]]] }
  set k "[expr {[lindex $s 0] > 8}] [lrange $s 2 end]"
  if {$k ne $prev} { echo "T[expr {[clock milliseconds]-$t0}] $s"; set prev $k }
}
shutdown
