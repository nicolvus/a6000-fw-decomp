adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [string range [string trim [chip.dap apreg 0 0x0c]] 2 end] }
set t0 [clock milliseconds]
while {[expr {[clock milliseconds]-$t0}] < 60000} {
  set l ""
  foreach b {0xf2406000 0xf2407000} { for {set i 5} {$i < 17} {incr i} { append l [string range [rd [expr {$b+4*$i}]] 5 end] " " } ; append l "| " }
  echo [format "T%d %s" [expr {[clock milliseconds]-$t0}] $l]
  after 200
}
shutdown
