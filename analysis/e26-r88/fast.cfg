adapter driver cmsis-dap
transport select swd
adapter speed 4000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [expr {[string trim [chip.dap apreg 0 0x0c]]}] }
proc wr {a v} { chip.dap apreg 0 0x04 $a; chip.dap apreg 0 0x0c $v }
set n 0; set prev ""
catch {
  set t0 [clock milliseconds]
  while {[expr {[clock milliseconds]-$t0}] < 30000} {
    if {($n % 50) == 0} { wr 0xf2912314 0x00100000 }
    set m [rd 0xf2406000]; set a [rd 0xf240602c]; set b [rd 0xf2406030]; set g [expr {([rd 0xf2912310]>>20)&1}]
    incr n
    set k "$m $a $b $g"
    if {$k ne $prev} { echo "T[expr {[clock milliseconds]-$t0}] $k"; set prev $k }
  }
}
wr 0xf2912318 0x00100000
echo "N $n FIN d3=[format %08x [rd 0xf2912310]]"
shutdown
