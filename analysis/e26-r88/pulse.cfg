adapter driver cmsis-dap
transport select swd
adapter speed 8000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
set t0 [clock microseconds]; set n 0
while {[expr {[clock microseconds]-$t0}] < 10000000} {
  chip.dap apreg 0 0x04 0xf240602c; set a [string trim [chip.dap apreg 0 0x0c]]
  chip.dap apreg 0 0x04 0xf2406030; set b [string trim [chip.dap apreg 0 0x0c]]
  incr n
  if {$a ne "0x00000000" || $b ne "0x00000000"} { echo "P [expr {[clock microseconds]-$t0}] $a $b" }
}
echo "N $n"
shutdown
