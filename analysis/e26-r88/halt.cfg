adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000
init
proc rd {a} { chip.dap apreg 0 0x04 $a; return [string trim [chip.dap apreg 0 0x0c]] }
proc setbit {op} {
  catch {halt}
  catch {wait_halt 2000}
  echo "halt: [chip.cpu curstate]"
  catch {mww phys $op 0x00100000} e; echo "mww $op: $e"
  catch {mdw phys 0xf2910310} r; echo "DATA3: $r"
  catch {resume}
}
setbit 0xf2910314
catch {
  set t0 [clock milliseconds]
  while {[expr {[clock milliseconds]-$t0}] < 45000} {
    set a [rd 0xf240602c]; set b [rd 0xf2406030]
    echo "T[expr {[clock milliseconds]-$t0}] $a $b"
    after 100
  }
}
setbit 0xf2910318
echo "FIN: [rd 0xf2910310]"
shutdown
