adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create c3 cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80116000
init
halt; wait_halt 1000
proc g {r} { return [lindex [c3 get_reg $r] 1] }
proc armw {} { catch {wp 0xf240602c 4 r} ; catch {wp 0xf2912314 4 w} }
proc disw {} { catch {rwp 0xf240602c}; catch {rwp 0xf2912314} }
armw
resume
set t0 [clock milliseconds]
for {set k 0} {$k < 40} {incr k} {
  set left [expr {75000 - ([clock milliseconds]-$t0)}]
  if {$left <= 0} break
  if {[catch {wait_halt $left}]} { echo "TIMEOUT"; break }
  echo "HIT k=$k t=[expr {[clock milliseconds]-$t0}] pc=[g pc] lr=[g lr] r0=[g r0] r1=[g r1] r2=[g r2] r3=[g r3] r4=[g r4] r5=[g r5] d3=[format %08x [c3 read_memory 0xf2912310 32 1]] ch6=[c3 read_memory 0xf240602c 32 1] ch7=[c3 read_memory 0xf2406030 32 1]"
  disw; step; armw; resume
}
catch {halt; wait_halt 500}
disw
resume
echo "END"
shutdown
