adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# R48 fase P1 (NO EJECUTAR sin autorización expresa): en el arranque 2, cada vez que Loader3 comprueba
# \updater\mode (c01f15c0, tras c01f44c6), se pone r0 = 0 ("existe") para que elija BootMode 3 y cargue
# el actualizador de fábrica de nflasha1. No escribe NAND ni memoria; solo el registro r0 en esa parada.
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
proc up {} { return [expr {![catch {chip.cpu arp_examine}]}] }
proc rg {r} { if {[catch {set v [lindex [chip.cpu get_reg $r] 1]}]} { return "" }; return $v }
proc ap1rd {a} { chip.dap apreg 1 0x04 $a; return [string trim [chip.dap apreg 1 0x0c]] }
proc linkup {} { return [expr {![catch {dap init}] && ![catch {ap1rd 0x80110000}]}] }
proc fasthalt {} {
  if {[catch {
    dap init
    chip.dap apreg 1 0x04 0x80110fb0; chip.dap apreg 1 0x0c 0xc5acce55
    chip.dap apreg 1 0x04 0x80110300; chip.dap apreg 1 0x0c 0
    chip.dap apreg 1 0x04 0x80110090; chip.dap apreg 1 0x0c 1
  }]} { return 0 }
  return 1
}
proc arm {lst} { catch {rbp all}; foreach {a l} $lst { if {[catch {bp $a $l hw} e]} { say "bp $a ERROR $e" } } }
set FINAL {0xc01f15c0 2 0xc01f1e16 2 0xc01f1378 2}
say "esperando apagado"
while {[linkup]} { sleep 200 }
say "camara apagada, esperando arranque 1"
while {![linkup]} {}
set t0 [clock milliseconds]
set cut 0
while {[clock milliseconds]-$t0 < 5000} { if {[catch {ap1rd 0x80110084}]} { set cut 1; break } }
if {!$cut} { say "PARADA: sin corte en 5 s, no se toca nada"; exit }
while {![fasthalt]} {}
set m 0
while {![up] && $m < 200} { incr m }
catch {halt}
say "arranque 2 parado pc=[rg pc]"
arm {0xc01f0000 4}
catch {resume}
set forced 0; set mode3 0; set ok 0
for {set k 0} {$k < 20} {incr k} {
  if {[catch {wait_halt 10000}]} { say "PARADA: BP_TIMEOUT k=$k"; break }
  set pc [rg pc]
  say "BP_HIT k=$k t=[expr {[clock milliseconds]-$t0}] pc=$pc r0=[rg r0] lr=[rg lr_svc]"
  if {$pc eq "0xc01f15c0"} {
    if {$forced >= 8} { say "PARADA: demasiadas comprobaciones"; break }
    say "  chk updater: r0 real=[rg r0] -> 0"
    chip.cpu set_reg {r0 0}
    if {[rg r0] ne "0x00000000"} { say "PARADA: r0 no cambió"; break }
    incr forced
  }
  if {$pc eq "0xc01f1e16"} { set mode3 1; say "  BootMode 3 elegido" }
  if {$pc eq "0xc01f1378"} { set ok 1; say "  entrada al actualizador (c01f1378), forzados=$forced"; break }
  catch {rbp all}
  if {$pc ne "0xc01f0000"} { if {[catch {step} e]} { say "PARADA: step ERROR $e"; break } }
  arm $FINAL
  catch {resume}
}
catch {rbp all}
catch {resume}
say [expr {$ok && $mode3 ? "FIN: actualizador en marcha; sonda en reposo" : "FIN sin actualizador (ver PARADA)"}]
exit
