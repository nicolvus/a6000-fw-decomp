adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# Diagnostico de solo lectura tras el NG de Darwin (0x1063) en la instalacion del 3.26 (03-11-2026).
# Para la CPU, lee PC/LR/SP/r0-r3/CPSR y una ventana de memoria alrededor de PC y SP; reanuda.
# No se escribe memoria ni NAND; no se hace reset.
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
if {[catch {dap init} e]} { say "dap init ERROR $e"; exit }
if {[catch {chip.cpu arp_examine} e]} { say "arp_examine ERROR $e"; exit }
if {[catch {halt 2000} e]} { say "halt ERROR $e"; exit }
foreach r {pc r0 r1 r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12 cpsr sp_svc lr_svc spsr_svc sp_usr lr_usr sp_irq lr_irq sp_abt lr_abt} {
  if {[catch {set v [lindex [chip.cpu get_reg $r] 1]} e]} { say "reg $r ERROR $e" } else { say "$r=$v" }
}
if {[catch {set pcv [lindex [chip.cpu get_reg pc] 1]}]} { set pcv "" }
if {$pcv ne ""} {
  if {[catch {set dump [chip.cpu read_memory $pcv 32 16]} e]} { say "mem@pc ERROR $e" } else { say "mem@pc($pcv)=$dump" }
}
if {[catch {set spv [lindex [chip.cpu get_reg sp_svc] 1]}]} { set spv "" }
if {$spv ne "" && $spv ne "0x00000000"} {
  if {[catch {set dumps [chip.cpu read_memory $spv 32 16]} e]} { say "mem@sp_svc ERROR $e" } else { say "mem@sp_svc($spv)=$dumps" }
}
catch {resume}
say "resumed"
exit
