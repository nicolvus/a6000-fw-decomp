adapter driver cmsis-dap
adapter serial E6698030DF5B3936
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
init
proc rdw {base n} {
  for {set i 0} {$i < $n} {incr i} {
    set a [expr {$base + 4*$i}]
    chip.dap apreg 0 0x04 $a
    set v [string trim [chip.dap apreg 0 0x0c]]
    echo [format "W %08x %s" $a $v]
  }
}
rdw 0x83deb360 64
rdw 0x83ed4908 24
rdw 0x83eee76c 1
rdw 0x83e77298 14
rdw 0x83eaadd8 20
rdw 0x83ea13dc 16
shutdown
