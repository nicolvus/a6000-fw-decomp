adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# Solo lectura (G11-LOG, 3.44a): para la CPU, lee registros; si PC está en Loader2/Loader3 vuelca la eSRAM (1 MiB)
# a través de la CPU. Reanuda siempre. Sin escrituras en memoria ni en NAND; sin reset.
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
if {[catch {dap init} e]} { say "dap init ERROR $e"; exit }
if {[catch {chip.cpu arp_examine} e]} { say "arp_examine ERROR $e"; exit }
if {[catch {halt 2000} e]} { say "halt ERROR $e"; exit }
foreach r {pc r0 r1 r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12 cpsr sp_svc lr_svc sp_usr lr_usr sp_abt lr_abt sp_und lr_und} {
  if {[catch {set v [lindex [chip.cpu get_reg $r] 1]} e]} { say "reg $r ERROR $e" } else { say "$r=$v" }
}
set pcv [lindex [chip.cpu get_reg pc] 1]
if {($pcv >= 0xc0030000 && $pcv < 0xc0037000) || ($pcv >= 0xc01f0000 && $pcv < 0xc0206000)} {
  say "PC en cargador: volcado eSRAM"
  if {[catch {dump_image $::env(OUTF) 0xc0000000 0x100000} e]} { say "dump ERROR $e" } else { say "dump ok" }
} else {
  say "PC fuera de los cargadores"
}
catch {resume}
say "resumed"
exit
