adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.ahb mem_ap -dap chip.dap -ap-num 0
catch {init}
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
targets chip.ahb
foreach {n a len} {cfg_210 0x83edf894 4 cfg_238 0x83edf8bc 4 gamma_153 0x83edf7d7 1 tipo_138 0x83edf7bc 4 nivel_13c 0x83edf7c0 4 sel_pp_cfg2 0x83ea1ebb 1 cave_tipos 0x83fb7400 12 cave_sw 0x83fb7450 16 gancho_sw 0x83c9... 0} { }
foreach {n a len} {cfg_210 0x83edf894 4 cfg_238 0x83edf8bc 4 gamma_153 0x83edf7d7 1 tipo_138 0x83edf7bc 4 nivel_13c 0x83edf7c0 4 cave_tipos 0x83fb7400 12 cave_sw 0x83fb7450 16 gancho_sw 0x837a4db2 4 gancho_mx 0x837a4b62 4 gancho_dl 0x837a44fa 4 curva_ptr_0x16 0x84001444 4 lit_tipos 0x837aafe0 4 cmp_tipo 0x837aa816 2} {
  if {[catch {set v [read_memory $a 8 $len]} e]} { say "$n ERROR $e" } else { say "$n @$a = [lmap x $v {format %02x $x}]" }
}
exit
