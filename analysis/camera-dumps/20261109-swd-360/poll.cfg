adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.ahb mem_ap -dap chip.dap -ap-num 0
catch {init}
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
targets chip.ahb
# bloque de ajustes vivo (cfg 0x43edf684, +0x100…+0x440): solo lectura, 2 vueltas por segundo, registra los bytes que cambian
set base 0x83edf684
set prev {}
set t0 [clock milliseconds]
while {[expr {[clock milliseconds]-$t0}] < $::env(MS)} {
  if {[catch {set cur [read_memory [expr {$base+0x100}] 8 0x340]} e]} { say "ERR $e"; after 500; continue }
  if {$prev ne {}} {
    set out {}
    for {set i 0} {$i < [llength $cur]} {incr i} {
      if {[lindex $cur $i] != [lindex $prev $i]} { lappend out [format "+0x%x:%02x->%02x" [expr {0x100+$i}] [lindex $prev $i] [lindex $cur $i]] }
    }
    if {$out ne {}} { say "[format %.1f [expr {([clock milliseconds]-$t0)/1000.0}]]s $out" }
  } else { say "inicio ok" }
  set prev $cur
  after 300
}
say "fin"
exit
