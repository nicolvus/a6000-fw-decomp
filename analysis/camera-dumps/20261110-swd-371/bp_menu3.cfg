adapter driver cmsis-dap
transport select swd
adapter speed 2000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# Solo observa: puntos de parada hardware en libObj (base 0x594f000), registra y reanuda. Sin escrituras de memoria.
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
proc rg {r} { if {[catch {set v [lindex [chip.cpu get_reg $r] 1]}]} { return "?" }; return $v }
set B $::env(BASE)
array set N [list [expr {$B+0x4c0a78}] ActionSetPP [expr {$B+0xFCB018}] eco [expr {$B+0x4a77bc}] lectura49]
if {[catch {dap init} e]} { say "dap init ERROR $e"; exit }
if {[catch {chip.cpu arp_examine} e]} { say "arp_examine ERROR $e"; exit }
catch {halt 2000}
proc arm {} { catch {rbp all}; foreach a [array names ::N] { if {[catch {bp $a 2 hw} e]} { say "bp $a ERROR $e" } } }
arm
catch {resume}
set t0 [clock milliseconds]
set last $t0
while {[expr {[clock milliseconds]-$t0}] < $::env(MS)} {
  if {[catch {chip.cpu arp_examine}]} { after 50; continue }
  if {![string match halted* [chip.cpu curstate]]} { set now [clock milliseconds]; if {$now-$::last > 1000} { set ::last $now; if {![catch {halt 500}]} { arm; resume } } }
  if {[string match halted* [chip.cpu curstate]] || ![catch {wait_halt 200}]} {
    set pc [rg pc]; set k [expr {$pc & ~1}]
    set nm "?"; foreach a [array names N] { if {($a & ~1) == $k} { set nm $N($a) } }
    say "[format %.2f [expr {([clock milliseconds]-$t0)/1000.0}]]s $nm pc=$pc r0=[rg r0] r1=[rg r1] r2=[rg r2] lr=[rg lr]"
    catch {resume}
  }
}
catch {rbp all}
catch {resume}
say "fin"
exit
