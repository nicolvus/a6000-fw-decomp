adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# CAM-394: sin parar la CPU, vigila el enlace; al existir $TRIG detiene la CPU UNA vez, vuelca registros y el log del kernel (log_buf), y reanuda.
proc say {m} { set f [open $::env(LOGF) a]; puts $f "[clock format [clock seconds] -format %T] $m"; close $f }
proc ap1rd {a} { chip.dap apreg 1 0x04 $a; return [string trim [chip.dap apreg 1 0x0c]] }
proc linkup {} { return [expr {![catch {dap init}] && ![catch {ap1rd 0x80110000}]}] }
proc rg {r} { if {[catch {set v [lindex [chip.cpu get_reg $r] 1]}]} { return "?" }; return $v }
proc w32 {a} { set v [chip.cpu read_memory $a 32 1]; return [lindex $v 0] }
proc captura {n} {
  if {[catch {chip.cpu arp_examine} e]} { say "examine ERROR $e" }
  if {[catch {halt 500} e]} { say "halt ERROR $e"; return }
  set s ""; foreach r {pc lr sp cpsr r0 r1 r2 r3} { append s " $r=[rg $r]" }; say "REG$s"
  if {[catch {
    set len [w32 0x4037c760]; set buf [w32 0x4037c764]; set end [w32 0x40395290]
    say [format "log_buf=0x%08x len=0x%x log_end=0x%x" $buf $len $end]
    if {$len > 0x40000} { set len 0x40000 }
    dump_image $::env(SALIDA)-$n.bin $buf $len
    say "volcado $::env(SALIDA)-$n.bin"
  } e]} { say "volcado ERROR $e" }
  catch {resume}
}
set prev -1; set n 0; set t0 0; set hechas {}
say "listo: capturas automáticas a +25 s y +42 s de cada arranque"
while {1} {
  set u [linkup]
  if {$u != $prev} { say [expr {$u ? "enlace SWD: SI" : "enlace SWD: no"}]; set prev $u; if {$u} { set t0 [clock seconds]; set hechas {} } }
  if {$u} {
    set dt [expr {[clock seconds] - $t0}]
    foreach m {25 42} { if {$dt >= $m && [lsearch $hechas $m] < 0} { lappend hechas $m; incr n; say "auto +$m s -> captura $n"; captura $n; say "captura $n hecha" } }
  }
  if {[file exists $::env(TRIG)]} { incr n; say "disparo $n"; captura $n; file delete $::env(TRIG); say "captura $n hecha" }
  sleep 500
}
