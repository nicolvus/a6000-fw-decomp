adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# CAM-394: muestreo de PC por SWD (halt breve + resume cada ~1 s). Solo lectura de registros y de 16 palabras de código en modo usuario.
proc say {m} { set f [open $::env(LOGF) a]; puts $f "[clock format [clock seconds] -format %T] $m"; close $f }
proc ap1rd {a} { chip.dap apreg 1 0x04 $a; return [string trim [chip.dap apreg 1 0x0c]] }
proc linkup {} { return [expr {![catch {dap init}] && ![catch {ap1rd 0x80110000}]}] }
proc rg {r} { if {[catch {set v [lindex [chip.cpu get_reg $r] 1]}]} { return "?" }; return $v }
set ex 0
set prev -1
say "muestreo iniciado"
while {1} {
  set u [linkup]
  if {$u != $prev} { say [expr {$u ? "enlace SWD: SI" : "enlace SWD: no"}]; set prev $u; set ex 0 }
  if {$u} {
    if {!$ex} { if {[catch {chip.cpu arp_examine} e]} { say "examine ERROR $e" } else { set ex 1 } }
    if {$ex} {
      if {[catch {halt 200} e]} { say "halt ERROR $e"; set ex 0 } else {
        set pc [rg pc]; set cp [rg cpsr]
        set s "pc=$pc cpsr=$cp lr=[rg lr] sp=[rg sp] r0=[rg r0]"
        if {$cp ne "?" && ($cp & 0x1f) == 0x10} { catch { append s " cod=[string map {"\n" " "} [chip.cpu mdw [expr {($pc & ~3) - 16}] 12]]" } }
        say $s
        catch {resume}
      }
    }
  }
  sleep 250
}
