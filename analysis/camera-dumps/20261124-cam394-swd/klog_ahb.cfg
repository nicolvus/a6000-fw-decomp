adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
catch {init}
# CAM-394: registro continuo del log del kernel por AHB-AP (memoria física, SIN detener la CPU). Solo lectura.
# log_buf_len/log_buf en VA 0x4037c760/4, log_end en VA 0x40395290; PA = VA + 0x40000000.
proc say {m} { set f [open $::env(LOGF) a]; puts $f "[clock format [clock seconds] -format %T] $m"; close $f }
proc out {bytes} { set f [open $::env(KLOG) ab]; fconfigure $f -translation binary; puts -nonewline $f $bytes; close $f }
proc rw0 {a} { chip.dap apreg 0 0x04 $a; return [string trim [chip.dap apreg 0 0x0c]] }
proc rbytes {a n} {
  set s [expr {$a & ~3}]; set e [expr {($a + $n + 3) & ~3}]; set b ""
  for {set x $s} {$x < $e} {incr x 4} { append b [binary format i [rw0 $x]] }
  return [string range $b [expr {$a - $s}] [expr {$a - $s + $n - 1}]]
}
proc rw {a} { return [rw0 $a] }
set prev -1; set last -1
say "klog AHB iniciado"
while {1} {
  set ok [expr {![catch {dap init}] && ![catch {set len [rw 0x8037c760]; set buf [rw 0x8037c764]; set end [rw 0x80395290]}]}]
  if {$ok != $prev} { say [expr {$ok ? "enlace: SI" : "enlace: no"}]; set prev $ok; set last -1 }
  if {$ok && $len > 0 && $len <= 0x100000} {
    set pb [expr {$buf + 0x40000000}]
    if {$last < 0 || $end < $last || $end - $last > $len} {
      set last [expr {$end > $len ? $end - $len : 0}]
      out "\n=== [clock format [clock seconds] -format %T] arranque/reinicio detectado (log_end=$end) ===\n"
    }
    while {$last < $end} {
      set i [expr {$last % $len}]; set n [expr {min($end - $last, $len - $i, 512)}]
      if {[catch {out [rbytes [expr {$pb + $i}] $n]} e]} { say "lectura ERROR $e"; break }
      incr last $n
    }
  }
  sleep 300
}
