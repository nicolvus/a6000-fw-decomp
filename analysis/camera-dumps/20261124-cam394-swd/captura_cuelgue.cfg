adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.cpu cortex_a -dap chip.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
catch {init}
# CAM-394: vigila el enlace SWD y, cuando existe $TRIG (cámara colgada tras Fn), detiene la CPU y vuelca registros y pila. Solo lectura.
proc say {m} { set f [open $::env(LOGF) a]; puts $f "[clock format [clock seconds] -format %T] $m"; close $f }
proc ap1rd {a} { chip.dap apreg 1 0x04 $a; return [string trim [chip.dap apreg 1 0x0c]] }
proc linkup {} { return [expr {![catch {dap init}] && ![catch {ap1rd 0x80110000}]}] }
proc rg {r} { if {[catch {set v [lindex [chip.cpu get_reg $r] 1]}]} { return "?" }; return $v }
proc captura {} {
  if {[catch {
    dap init
    chip.dap apreg 1 0x04 0x80110fb0; chip.dap apreg 1 0x0c 0xc5acce55
    chip.dap apreg 1 0x04 0x80110300; chip.dap apreg 1 0x0c 0
    chip.dap apreg 1 0x04 0x80110090; chip.dap apreg 1 0x0c 1
  } e]} { say "fasthalt ERROR $e"; return }
  say "DSCR=[ap1rd 0x80110088] PCSR=[ap1rd 0x801100a0]"
  for {set k 0} {$k < 8} {incr k} { say "PCSR muestra $k = [ap1rd 0x801100a0]" }
  if {[catch {chip.cpu arp_examine} e]} { say "examine ERROR $e" }
  catch {halt}
  set s ""
  foreach r {pc lr sp cpsr r0 r1 r2 r3 r4 r5 r6 r7 r8 r9 r10 r11 r12} { append s " $r=[rg $r]" }
  say "REG$s"
  catch { say "PILA [chip.cpu mdw [rg sp] 64]" }
  catch { say "CODIGO [chip.cpu mdw [expr {([rg pc] & ~3) - 32}] 24]" }
}
set prev -1
say "vigilando (TRIG=$::env(TRIG))"
while {1} {
  set u [linkup]
  if {$u != $prev} { say [expr {$u ? "enlace SWD: SI" : "enlace SWD: no"}]; set prev $u }
  if {[file exists $::env(TRIG)]} { say "disparo"; captura; file delete $::env(TRIG); say "captura hecha" }
  sleep 300
}
