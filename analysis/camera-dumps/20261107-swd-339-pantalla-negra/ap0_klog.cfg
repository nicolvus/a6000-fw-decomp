adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip tap -enable
dap create chip.dap -chain-position chip.tap
target create chip.ahb mem_ap -dap chip.dap -ap-num 0
catch {init}
proc say {m} { set f [open $::env(LOGF) a]; puts $f $m; close $f }
set t0 [clock milliseconds]
targets chip.ahb
if {[catch {dump_image $::env(OUTF) $::env(ADDR) $::env(LEN)} e]} { say "dump ERROR $e" } else { say "dump ok [expr {[clock milliseconds]-$t0}] ms" }
exit
