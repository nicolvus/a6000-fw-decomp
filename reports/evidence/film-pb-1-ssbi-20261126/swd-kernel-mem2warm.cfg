gdb_port disabled
telnet_port disabled
tcl_port disabled
adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap a6000 tap -enable
dap create a6000.dap -chain-position a6000.tap
target create a6000.ram mem_ap -dap a6000.dap -ap-num 0
init
set cores {0x80110000 0x80112000 0x80114000 0x80116000}
set armed_address 0x40091f7c
set control 0x1e7
set touched {}

proc rd {addr} {
    a6000.dap apreg 1 0x04 $addr
    return [string trim [a6000.dap apreg 1 0x0c]]
}
proc wr {addr value} {
    a6000.dap apreg 1 0x04 $addr
    a6000.dap apreg 1 0x0c $value
}
proc read_state {b} {
    return [rd [expr {$b+0x88}]]
}
proc restore_slot {b} {
    lassign $::original($b) v c d
    set bcr [rd [expr {$b+0x140}]]
    set bvr [rd [expr {$b+0x100}]]
    set dscr [read_state $b]
    if {$bvr == $::armed_address && $bcr == $::control} {
        wr [expr {$b+0x140}] $c
    } elseif {$bcr & 1} {
        error "Deliberately skipped a different active comparator"
    }
    if {($dscr & 1) && (($dscr >> 2) & 15) == 1 && $bvr == $::armed_address} {
        wr [expr {$b+0x90}] 2
    }
    if {$bvr == $::armed_address} { wr [expr {$b+0x100}] $v }
    set now [read_state $b]
    if {(($now ^ $d) & 0x4000) != 0} {
        wr [expr {$b+0x88}] [expr {($now & ~0x4000) | ($d & 0x4000)}]
    }
    if {([read_state $b] & 1) != 0} { error "Core still halted" }
    if {([rd [expr {$b+0x140}]] & 1) != 0} { error "Comparator unexpectedly active" }
    echo [format "CLEAN %08x pc_halted=0 bp_enabled=0" $b]
}
proc clean {} {
    set ok 1
    foreach b $::touched {
        if {[catch {restore_slot $b} msg]} {
            echo [format "CLEAN_ERROR %08x %s" $b $msg]
            set ok 0
        }
    }
    return $ok
}


proc itr {b instruction} {
    wr [expr {$b+0x84}] $instruction
    for {set i 0} {$i<30} {incr i} {
        if {[read_state $b] & 0x01000000} { return }
    }
    error "Debug instruction did not complete"
}
proc read_reg {b n} {
    itr $b [expr {0xee000e15 | ($n<<12)}]
    if {([read_state $b] & 0x20000000)==0} {
        error "No register value in the debug transfer register"
    }
    return [rd [expr {$b+0x8c}]]
}
proc write_r0 {b value} {
    wr [expr {$b+0x80}] $value
    itr $b 0xee100e15
}
proc ram32 {va} {
    if {$va<0x40000000 || $va>0x4ffffffc || ($va&3)} {
        error "Read outside the verified RAM mapping"
    }
    return [lindex [a6000.ram read_memory [expr {$va+0x40000000}] 32 1] 0]
}
proc change_request {b} {
    if {![file exists /tmp/a6000-interruptor-warm-verificado/interruptor-listo]} {
        echo "SKIPPED switch signal not issued"
        return
    }
    set old [read_state $b]
    wr [expr {$b+0x88}] [expr {$old|0x2000}]
    set modified 0
    set ok [catch {
        set state [read_reg $b 0]
        set sp [read_reg $b 13]
        set task [ram32 [expr {($sp&~0x1fff)+0xc}]]
        set c0 [ram32 [expr {$task+0x1e8}]]
        set c1 [ram32 [expr {$task+0x1ec}]]
        if {$state!=3 || $c0!=0x652e6d69 || ($c1&0xffffff)!=0x666c} {
            error [format "Unexpected request state=%u comm_words=%08x/%08x" $state $c0 $c1]
        }
        echo "NATIVE_REQUEST task=im.elf state=mem (3) time=[clock milliseconds]"
        set modified 1
        write_r0 $b 4
        if {[read_reg $b 0]!=4} { error "warm readback failed" }
        echo "CONVERTED task=im.elf state=warm (4) time=[clock milliseconds]"
    } error_message]
    if {$ok && $modified} { catch {write_r0 $b $state} }
    set current [read_state $b]
    wr [expr {$b+0x88}] [expr {($current&~0x2000)|($old&0x2000)}]
    if {$ok} { echo "NO_CHANGE_OR_ROLLBACK $error_message" }
}

set words [a6000.ram read_memory 0x80091f78 32 2]
if {[lindex $words 0] != 0xe1a00005 || [lindex $words 1] != 0xeb0002b9} {
    error "The state_store callsite does not match the verified kernel"
}
set f [open /tmp/a6000-interruptor-warm-verificado/debug-antes.txt w]
foreach b $cores {
    set d [read_state $b]
    set did [rd $b]
    set count [expr {(($did >> 24) & 15)+1}]
    if {$did != 0x1203f001 || ($d & 1) || ([rd [expr {$b+0xfb4}]] & 2) ||
        ([rd [expr {$b+0x304}]] & 2)} {
        close $f
        error "Unexpected, halted or locked core; no breakpoint installed"
    }
    for {set k 0} {$k<$count} {incr k} {
        if {[rd [expr {$b+0x140+4*$k}]] & 1} {
            close $f
            error "An existing breakpoint is active; no breakpoint installed"
        }
    }
    set original($b) [list [rd [expr {$b+0x100}]] [rd [expr {$b+0x140}]] $d]
    puts $f "$b $original($b)"
}
close $f

set outcome [catch {
    foreach b $cores {
        lappend touched $b
        set d [lindex $original($b) 2]
        wr [expr {$b+0x88}] [expr {$d|0x4000}]
        wr [expr {$b+0x100}] $armed_address
        wr [expr {$b+0x140}] $control
        if {([read_state $b]&0x4001)!=0x4000 ||
            [rd [expr {$b+0x100}]]!=$armed_address ||
            [rd [expr {$b+0x140}]]!=$control} {
            error "Could not verify hardware comparator"
        }
    }
    echo "ARMED entry=0x40091f7c cores=4 time=[clock milliseconds]"
    set end [expr {[clock milliseconds]+340000}]
    set hit 0
    while {[clock milliseconds]<$end && !$hit && ![file exists /tmp/a6000-interruptor-warm-verificado/fin-captura]} {
        foreach b $cores {
            set d [read_state $b]
            if {$d & 1} {
                set method [expr {($d>>2)&15}]
                if {$method==1 && [rd [expr {$b+0x100}]]==$armed_address &&
                    [rd [expr {$b+0x140}]]==$control} {
                    echo [format "HIT time=%s core=%08x bp=%08x DSCR=%s PCSR=%s" [clock milliseconds] $b $armed_address $d [rd [expr {$b+0xa0}]]]
                    # Disable the owned comparator and release the core immediately.
                    wr [expr {$b+0x140}] [lindex $original($b) 1]
                    if {[catch {change_request $b} message]} { echo "CHANGE_ERROR $message" }
                    wr [expr {$b+0x90}] 2
                    echo [format "RESUME time=%s core=%08x DSCR=%s" [clock milliseconds] $b [read_state $b]]
                } else {
                    echo [format "UNEXPECTED_HALT core=%08x DSCR=%s" $b $d]
                }
                set hit 1
                break
            }
        }
        if {!$hit} { sleep 5 }
    }
} diagnostic]
if {$outcome} { echo "INTERRUPTED time=[clock milliseconds] $diagnostic" }
set restored [clean]
for {set attempt 0} {!$restored && $attempt<12} {incr attempt} {
    sleep 100
    catch {dap init}
    set restored [clean]
}
echo "FIN clean=$restored diagnostic_error=$outcome"
shutdown
