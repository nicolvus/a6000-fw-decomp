gdb_port disabled
telnet_port disabled
tcl_port disabled
adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap a6000 tap -enable
dap create a6000.dap -chain-position a6000.tap
target create a6000.ram mem_ap -dap a6000.dap -ap-num 0
init
set cores {0x80110000 0x80112000 0x80114000 0x80116000}
set armed_address 0x0000a130
set control 0x65
set touched {}

proc rd {addr} {
    a6000.dap apreg 1 0x04 $addr
    return [string trim [a6000.dap apreg 1 0x0c]]
}
proc wr {addr value} {
    a6000.dap apreg 1 0x04 $addr
    a6000.dap apreg 1 0x0c $value
}
proc read_state {b} {
    return [rd [expr {$b+0x88}]]
}
proc restore_slot {b} {
    lassign $::original($b) v c d
    set bcr [rd [expr {$b+0x140}]]
    set bvr [rd [expr {$b+0x100}]]
    set dscr [read_state $b]
    if {$bvr == $::armed_address && $bcr == $::control} {
        wr [expr {$b+0x140}] $c
    } elseif {$bcr & 1} {
        error "Deliberately skipped a different active comparator"
    }
    if {($dscr & 1) && (($dscr >> 2) & 15) == 1 && $bvr == $::armed_address} {
        wr [expr {$b+0x90}] 2
    }
    if {$bvr == $::armed_address} { wr [expr {$b+0x100}] $v }
    set now [read_state $b]
    if {(($now ^ $d) & 0x4000) != 0} {
        wr [expr {$b+0x88}] [expr {($now & ~0x4000) | ($d & 0x4000)}]
    }
    if {([read_state $b] & 1) != 0} { error "Core still halted" }
    if {([rd [expr {$b+0x140}]] & 1) != 0} { error "Comparator unexpectedly active" }
    echo [format "CLEAN %08x pc_halted=0 bp_enabled=0" $b]
}
proc clean {} {
    set ok 1
    foreach b $::touched {
        if {[catch {restore_slot $b} msg]} {
            echo [format "CLEAN_ERROR %08x %s" $b $msg]
            set ok 0
        }
    }
    return $ok
}


proc itr {b instruction} {
    wr [expr {$b+0x84}] $instruction
    for {set i 0} {$i<30} {incr i} {
        if {[read_state $b] & 0x01000000} { return }
    }
    error "Debug instruction did not complete"
}
proc read_reg {b n} {
    itr $b [expr {0xee000e15 | ($n<<12)}]
    if {([read_state $b] & 0x20000000)==0} {
        error "No register value in the debug transfer register"
    }
    return [rd [expr {$b+0x8c}]]
}
proc write_r0 {b value} {
    wr [expr {$b+0x80}] $value
    itr $b 0xee100e15
}

proc write_r3 {b value} {
    wr [expr {$b+0x80}] $value
    itr $b 0xee103e15
}
set converted 0
proc change_request {b} {
    set old [read_state $b]
    wr [expr {$b+0x88}] [expr {$old|0x2000}]
    set result "NO_MATCH"
    set ok [catch {
        set r1 [read_reg $b 1]
        set r2 [read_reg $b 2]
        set r3 [read_reg $b 3]
        set r4 [read_reg $b 4]
        if {$r2==0x153e0 && $r1==0x15248} {
            echo [format "NATIVE_OFF_FACTOR msg=%08x off=0x%x time=%s" $r4 $r3 [clock milliseconds]]
            if {$r3 != 0x27} {
                write_r3 $b 0x27
                if {[read_reg $b 3]!=0x27} { error "r3 readback failed" }
                echo "CONVERTED off_factor 0x[format %x $r3] -> 0x27 (tipo 8, modo 2 nativo)"
            } else { echo "ALREADY_WARM off=0x27" }
            set result "MATCH"
        } else {
            set result [format "NO_MATCH r1=%08x r2=%08x" $r1 $r2]
        }
    } msg]
    set current [read_state $b]
    wr [expr {$b+0x88}] [expr {($current&~0x2000)|($old&0x2000)}]
    if {$ok} { echo "CHANGE_ERROR $msg"; return "ERROR" }
    return $result
}
set f [open /tmp/a6000-interruptor-warm-verificado/debug-antes.txt w]
foreach b $cores {
    set d [read_state $b]
    set did [rd $b]
    set count [expr {(($did >> 24) & 15)+1}]
    if {$did != 0x1203f001 || ($d & 1) || ([rd [expr {$b+0xfb4}]] & 2) || ([rd [expr {$b+0x304}]] & 2)} {
        close $f; error "Unexpected, halted or locked core; no breakpoint installed"
    }
    for {set k 0} {$k<$count} {incr k} {
        if {[rd [expr {$b+0x140+4*$k}]] & 1} { close $f; error "An existing breakpoint is active; no breakpoint installed" }
    }
    set original($b) [list [rd [expr {$b+0x100}]] [rd [expr {$b+0x140}]] $d]
    puts $f "$b $original($b)"
}
close $f
proc arm_all {} {
    foreach b $::cores {
        wr [expr {$b+0x100}] $::armed_address
        wr [expr {$b+0x140}] $::control
    }
}
set outcome [catch {
    foreach b $cores {
        lappend touched $b
        set d [lindex $original($b) 2]
        wr [expr {$b+0x88}] [expr {$d|0x4000}]
    }
    arm_all
    foreach b $cores {
        if {([read_state $b]&0x4001)!=0x4000 || [rd [expr {$b+0x100}]]!=$armed_address || [rd [expr {$b+0x140}]]!=$control} {
            error "Could not verify hardware comparator"
        }
    }
    echo "ARMED user=0x0000a130 thumb control=0x65 cores=4 time=[clock milliseconds]"
    set end [expr {[clock milliseconds]+340000}]
    set done 0
    set misses 0
    while {[clock milliseconds]<$end && !$done && ![file exists /tmp/a6000-interruptor-warm-verificado/fin-captura]} {
        foreach b $cores {
            set d [read_state $b]
            if {$d & 1} {
                if {(($d>>2)&15)!=1} { echo [format "UNEXPECTED_HALT core=%08x DSCR=%s" $b $d]; set done 1; break }
                foreach c $cores { wr [expr {$c+0x140}] [lindex $original($c) 1] }
                echo [format "HIT time=%s core=%08x" [clock milliseconds] $b]
                set r [change_request $b]
                wr [expr {$b+0x90}] 2
                echo [format "RESUME core=%08x %s" $b $r]
                if {$r eq "MATCH" || $r eq "ERROR"} { set done 1; break }
                incr misses
                if {$misses>40} { echo "TOO_MANY_MISSES"; set done 1; break }
                sleep 2
                arm_all
            }
        }
        if {!$done} { sleep 5 }
    }
} diagnostic]
if {$outcome} { echo "INTERRUPTED time=[clock milliseconds] $diagnostic" }
set restored [clean]
for {set attempt 0} {!$restored && $attempt<12} {incr attempt} { sleep 100; catch {dap init}; set restored [clean] }
echo "FIN clean=$restored diagnostic_error=$outcome"
shutdown
