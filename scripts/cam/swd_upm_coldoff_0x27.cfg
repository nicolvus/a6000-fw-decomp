# Apagado "de fábrica" para la escalera SSBI (reports/film-pb-1-wbi-escalera-ssbi-20261128.md §3-§5).
#
# Intercepta en el receptor, upm.ko k_upm_off_factor_handler_active, la instrucción 0xefec
# (`ldr r3,[r4,#4]`, primera lectura del factor) y reescribe el mensaje recibido a
# {UPM_CMD_OFF_FACTOR 0x920141, factor 0x27, motivo 0x1c, código 0x20}: el registro que guarda la WBI
# de Sony (VA 0x3f33af48+4). Así upm para el perfilado si lo hay (0xeff0), lo guarda como último
# apagado (lo lee libObj GetInactiveFactor 0x7e7c18 tras reanudar: 0x1c => OFF_TYPE_COLDOFF) y reenvía a
# im.elf factor 0x27 => tipo 8, modo 2, "warm". No toca im.elf ni libObj.
#
# El cfg del 27-11 (swd-imelf-offfactor-0x27.cfg) cambiaba r3 en im.elf@0xA130: upm se quedaba con
# {7, 0x1b, 0x1f} y la reanudación arrancaba como vuelta de suspensión (OFF_TYPE_SUSPEND).
#
# VA de upm.ko: .text en 0x3f326000, medido igual en la WBI de Sony 3.21 y en la captura del CFW 4.05
# (scripts/wbi/upm_modulo.py). Si un /usr cambia los módulos, recalcularla antes (UPM_TEXT=...).
# Los almacenamientos se ejecutan con ITR en el propio núcleo (coherentes con su caché), no por el AP.
#
# Uso: cámara YA ARRANCADA (nunca armar durante el arranque). Desde scripts/cam:
#   openocd -f swd_upm_coldoff_0x27.cfg        # ARMED ...; pulsar el interruptor en < 340 s
# Éxito: "CONVERTED ..." y "FIN clean=1". Cualquier otra cosa: no se ha cambiado nada.
gdb_port disabled
telnet_port disabled
tcl_port disabled
adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap a6000 tap -enable
dap create a6000.dap -chain-position a6000.tap
target create a6000.ram mem_ap -dap a6000.dap -ap-num 0
init
set cores {0x80110000 0x80112000 0x80114000 0x80116000}
if {[info exists ::env(UPM_TEXT)]} { set upm_text $::env(UPM_TEXT) } else { set upm_text 0x3f326000 }
if {[info exists ::env(DIR)]} { set dir $::env(DIR) } else { set dir /tmp/a6000-swd-coldoff }
file mkdir $dir
set armed_address [format 0x%08x [expr {$upm_text + 0xefec}]]
# ARM (BAS=0b1111), PMC=0b01 privilegiado, activo
set control 0x1e3
set touched {}

proc rd {addr} {
    a6000.dap apreg 1 0x04 $addr
    return [string trim [a6000.dap apreg 1 0x0c]]
}
proc wr {addr value} {
    a6000.dap apreg 1 0x04 $addr
    a6000.dap apreg 1 0x0c $value
}
proc read_state {b} { return [rd [expr {$b+0x88}]] }
proc restore_slot {b} {
    lassign $::original($b) v c d
    set bcr [rd [expr {$b+0x140}]]
    set bvr [rd [expr {$b+0x100}]]
    set dscr [read_state $b]
    if {$bvr == $::armed_address && $bcr == $::control} {
        wr [expr {$b+0x140}] $c
    } elseif {$bcr & 1} {
        error "Deliberately skipped a different active comparator"
    }
    if {($dscr & 1) && (($dscr >> 2) & 15) == 1 && $bvr == $::armed_address} {
        wr [expr {$b+0x90}] 2
    }
    if {$bvr == $::armed_address} { wr [expr {$b+0x100}] $v }
    set now [read_state $b]
    if {(($now ^ $d) & 0x4000) != 0} {
        wr [expr {$b+0x88}] [expr {($now & ~0x4000) | ($d & 0x4000)}]
    }
    if {([read_state $b] & 1) != 0} { error "Core still halted" }
    if {([rd [expr {$b+0x140}]] & 1) != 0} { error "Comparator unexpectedly active" }
    echo [format "CLEAN %08x pc_halted=0 bp_enabled=0" $b]
}
proc clean {} {
    set ok 1
    foreach b $::touched {
        if {[catch {restore_slot $b} msg]} {
            echo [format "CLEAN_ERROR %08x %s" $b $msg]
            set ok 0
        }
    }
    return $ok
}
proc itr {b instruction} {
    wr [expr {$b+0x84}] $instruction
    for {set i 0} {$i<30} {incr i} {
        set s [read_state $b]
        if {$s & 0x40} { error [format "Sticky abort executing %08x (DSCR=%s)" $instruction $s] }
        if {$s & 0x01000000} { return }
    }
    error "Debug instruction did not complete"
}
# mcr p14,0,rN,c0,c5,0 : rN -> DTRTX
proc read_reg {b n} {
    itr $b [expr {0xee000e15 | ($n<<12)}]
    if {([read_state $b] & 0x20000000)==0} { error "No register value in the debug transfer register" }
    return [rd [expr {$b+0x8c}]]
}
# mrc p14,0,rN,c0,c5,0 : DTRRX -> rN
proc write_reg {b n value} {
    wr [expr {$b+0x80}] $value
    itr $b [expr {0xee100e15 | ($n<<12)}]
    if {[read_reg $b $n] != $value} { error [format "r%d readback failed" $n] }
}
# Palabra [r4+off] leída por el núcleo: ldr r0,[r4,#off]
proc ld_r4 {b off} {
    itr $b [expr {0xe5940000 | $off}]
    return [read_reg $b 0]
}
# [r4+off] = value escrito por el núcleo: str r0,[r4,#off]
proc st_r4 {b off value} {
    write_reg $b 0 $value
    itr $b [expr {0xe5840000 | $off}]
    if {[ld_r4 $b $off] != $value} { error [format "[r4+%d] readback failed" $off] }
}
proc change_request {b} {
    set old [read_state $b]
    wr [expr {$b+0x88}] [expr {$old|0x2000}]
    set result "NO_MATCH"
    set err [catch {
        set r0 [read_reg $b 0]
        set r4 [read_reg $b 4]
        if {$r4 < 0x40000000 || $r4 >= 0x60000000 || ($r4 & 3)} {
            set result [format "NO_MATCH r4=%08x fuera de lowmem" $r4]
        } else {
            set m0 [ld_r4 $b 0]; set m1 [ld_r4 $b 4]; set m2 [ld_r4 $b 8]; set m3 [ld_r4 $b 12]
            if {$m0 != 0x920141} {
                set result [format "NO_MATCH msg0=%08x" $m0]
            } else {
                echo [format "NATIVE_OFF factor=0x%x motivo=0x%x codigo=0x%x time=%s" $m1 $m2 $m3 [clock milliseconds]]
                st_r4 $b 4 0x27
                st_r4 $b 8 0x1c
                st_r4 $b 12 0x20
                echo "CONVERTED -> factor=0x27 motivo=0x1c codigo=0x20 (mensaje de fábrica)"
                set result "MATCH"
            }
        }
        write_reg $b 0 $r0
    } msg]
    set current [read_state $b]
    wr [expr {$b+0x88}] [expr {($current&~0x2000)|($old&0x2000)}]
    if {$err} { echo "CHANGE_ERROR $msg"; return "ERROR" }
    return $result
}
set f [open $dir/debug-antes.txt w]
foreach b $cores {
    set d [read_state $b]
    set did [rd $b]
    set count [expr {(($did >> 24) & 15)+1}]
    if {$did != 0x1203f001 || ($d & 1) || ([rd [expr {$b+0xfb4}]] & 2) || ([rd [expr {$b+0x304}]] & 2)} {
        close $f; error "Unexpected, halted or locked core; no breakpoint installed"
    }
    for {set k 0} {$k<$count} {incr k} {
        if {[rd [expr {$b+0x140+4*$k}]] & 1} { close $f; error "An existing breakpoint is active; no breakpoint installed" }
    }
    set original($b) [list [rd [expr {$b+0x100}]] [rd [expr {$b+0x140}]] $d]
    puts $f "$b $original($b)"
}
close $f
proc arm_all {} {
    foreach b $::cores {
        wr [expr {$b+0x100}] $::armed_address
        wr [expr {$b+0x140}] $::control
    }
}
set outcome [catch {
    foreach b $cores {
        lappend touched $b
        set d [lindex $original($b) 2]
        wr [expr {$b+0x88}] [expr {$d|0x4000}]
    }
    arm_all
    foreach b $cores {
        if {([read_state $b]&0x4001)!=0x4000 || [rd [expr {$b+0x100}]]!=$armed_address || [rd [expr {$b+0x140}]]!=$control} {
            error "Could not verify hardware comparator"
        }
    }
    echo "ARMED kernel=$armed_address (upm.ko .text $upm_text + 0xefec) arm control=$control cores=4 time=[clock milliseconds]"
    set end [expr {[clock milliseconds]+340000}]
    set done 0
    set misses 0
    while {[clock milliseconds]<$end && !$done && ![file exists $dir/fin-captura]} {
        foreach b $cores {
            set d [read_state $b]
            if {$d & 1} {
                if {(($d>>2)&15)!=1} { echo [format "UNEXPECTED_HALT core=%08x DSCR=%s" $b $d]; set done 1; break }
                foreach c $cores { wr [expr {$c+0x140}] [lindex $original($c) 1] }
                echo [format "HIT time=%s core=%08x" [clock milliseconds] $b]
                set r [change_request $b]
                wr [expr {$b+0x90}] 2
                echo [format "RESUME core=%08x %s" $b $r]
                if {$r eq "MATCH" || $r eq "ERROR"} { set done 1; break }
                incr misses
                if {$misses>40} { echo "TOO_MANY_MISSES"; set done 1; break }
                sleep 2
                arm_all
            }
        }
        if {!$done} { sleep 5 }
    }
} diagnostic]
if {$outcome} { echo "INTERRUPTED time=[clock milliseconds] $diagnostic" }
set restored [clean]
for {set attempt 0} {!$restored && $attempt<12} {incr attempt} { sleep 100; catch {dap init}; set restored [clean] }
echo "FIN clean=$restored diagnostic_error=$outcome"
shutdown
